name: Build Windows Desktop App (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build ChatFlow .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install & test Gateway
        run: |
          cd gateway
          npm ci
          npm run build
          npm test
          cd ..

      - name: Run frontend typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_APP_URL: https://168-138-160-93.sslip.io
          NEXT_PUBLIC_GATEWAY_URL: wss://168-138-160-93.sslip.io
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://boonwujyiwqbrraqdbdy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_xv9IiylFCrxZgG3WHnk7mw_as0YB9gH' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_xv9IiylFCrxZgG3WHnk7mw_as0YB9gH' }}
        run: npm run build

      - name: Build Windows .exe with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatFlow-Windows-Exe
          path: release/*.exe
          retention-days: 30

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
